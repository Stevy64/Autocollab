{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6f8">
  <meta name="description" content="Signalements de bouchons, accidents, travaux et contrôles à Libreville. Une carte simple, alimentée par les conducteurs.">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Wayizé">
  <title>Wayizé — Circulation à Libreville</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="{% static 'trafic/icons/favicon-32.png' %}" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="{% static 'trafic/icons/apple-touch-icon.png' %}">
  <link rel="stylesheet" href="{% static 'trafic/vendor/leaflet/leaflet.css' %}">
  <link rel="stylesheet" href="{% static 'trafic/css/app.css' %}">
</head>
<body>
  <a class="skip" href="#sheet">Aller aux signalements</a>
  <div id="app">
    <div id="map" role="application" aria-label="Carte de la circulation à Libreville"></div>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path d="M12 21s-6.2-5.8-6.2-10.4C5.8 7 8.6 4.4 12 4.4s6.2 2.6 6.2 6.2C18.2 15.2 12 21 12 21z" fill="#fff"/>
            <circle cx="12" cy="10.5" r="2.15" fill="#e10600"/>
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">Wayizé</span>
          <span class="brand-city">Libreville</span>
        </span>
      </div>
      <div class="tendance-wrap is-loading" id="tendance-wrap">
        <button type="button" class="tendance-toggle" id="tendance-toggle" disabled aria-expanded="false" aria-controls="tendance-bar" aria-label="Circulation">
          <span class="dot" aria-hidden="true"></span>
        </button>
        <div class="tendance-bar" id="tendance-bar" hidden>
          <span class="dot" id="tendance-dot" aria-hidden="true"></span>
          <strong id="tendance-titre">Lecture de la circulation…</strong>
          <button type="button" class="tendance-signaler" id="tendance-signaler">
            <svg class="ui-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path d="M6.2 16.5h11.6M12 4.2a4.6 4.6 0 0 1 4.6 4.6c0 3.2.8 4.4 1.4 5.2H6c.6-.8 1.4-2 1.4-5.2A4.6 4.6 0 0 1 12 4.2z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
              <path d="M10.2 17.2a1.8 1.8 0 0 0 3.6 0" fill="none" stroke="currentColor" stroke-width="1.7"/>
              <path d="M19.2 5.2 21 3.6M4.8 5.2 3 3.6M12 2.2v1.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
            Signaler
          </button>
          <button type="button" class="search-close" id="tendance-close" aria-label="Fermer la circulation">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <div class="tendance-panel" id="tendance-panel" hidden>
          <p id="tendance-detail">Libreville</p>
          <ul id="tendance-liste"></ul>
        </div>
      </div>
      <div class="search" id="search">
        <button type="button" class="icon-btn" id="search-toggle" aria-expanded="false" aria-controls="search-field" aria-label="Rechercher un quartier ou un lieu">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <circle cx="11" cy="11" r="6.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <path d="M15.8 15.8 20 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
        <form class="search-field" id="search-field" role="search" hidden>
          <input id="search-input" type="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Quartier, zone ou lieu" aria-label="Quartier, zone ou lieu" aria-controls="search-results" aria-autocomplete="list">
          <button type="button" class="search-close" id="search-close" aria-label="Fermer la recherche">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>
        </form>
        <ul class="search-results" id="search-results" role="listbox" hidden></ul>
      </div>
      <button type="button" class="icon-btn" id="recenter" aria-label="Recentrer la carte sur Libreville">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <circle cx="12" cy="12" r="3.1" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <path d="M12 3.2v3.2M12 17.6v3.2M3.2 12h3.2M17.6 12h3.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </header>
    <div id="pick-banner" class="pick-banner" hidden>
      <p><svg class="ui-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 20.5s-5.2-4.8-5.2-9.2a5.2 5.2 0 0 1 10.4 0c0 4.4-5.2 9.2-5.2 9.2z" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="11.2" r="1.7" fill="currentColor"/></svg> Touchez la carte pour placer le signalement</p>
      <button type="button" id="pick-cancel">Annuler</button>
    </div>
    <aside id="sheet" class="sheet" aria-label="Signalements">
      <button type="button" class="grabber" id="grabber" aria-label="Redimensionner la liste des signalements"></button>
      <div id="sheet-content" class="sheet-content">
        <div class="sheet-head">
          <div>
            <h1>En ce moment</h1>
            <p>Lecture des signalements…</p>
          </div>
        </div>
        <div class="skeleton-list" aria-hidden="true">
          <div class="skeleton"></div>
          <div class="skeleton"></div>
          <div class="skeleton"></div>
        </div>
      </div>
    </aside>
    <div id="toast" class="toast" hidden role="status"></div>
  </div>
  <noscript>
    <div class="noscript">Activez JavaScript pour afficher la carte et les signalements de Libreville.</div>
  </noscript>
  {{ boot|json_script:"boot-data" }}
  <script src="{% static 'trafic/vendor/leaflet/leaflet.js' %}" defer></script>
  <script src="{% static 'trafic/js/app.js' %}" defer></script>
</body>
</html>
