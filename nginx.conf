# Site nginx pour wayize.gabomazone.com.
# À copier vers /etc/nginx/sites-available/wayize puis activer.
# Ce n'est pas un nginx.conf complet (pas de bloc events/http).
#
# TLS se termine ici. Les deux processus Django restent sur le loopback :
#   frontal  127.0.0.1:8647   (gunicorn, wayize_web.prod)
#   API      127.0.0.1:8648   (gunicorn, wayize_api.prod)
#
# /api/ n'est PAS envoyé à l'API. Le frontal ajoute X-Wayize-Session
# avant d'appeler WAYIZE_API_URL. Court-circuiter cette porte casse
# les signalements anonymes.

upstream wayize_web {
    server 127.0.0.1:8647;
}

server {
    listen 80;
    listen [::]:80;
    server_name wayize.gabomazone.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wayize.gabomazone.com;

    ssl_certificate     /etc/letsencrypt/live/wayize.gabomazone.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wayize.gabomazone.com/privkey.pem;

    client_max_body_size 1m;

    # Fichiers collectés : frontend/staticfiles (ou WAYIZE_STATIC_ROOT).
    # HTML, sw.js et /api/ restent no-store, servis par Django.
    location /static/ {
        alias /srv/wayize/frontend/staticfiles/;
        access_log off;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        proxy_pass http://wayize_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_redirect off;
        proxy_read_timeout 30s;
    }
}
